[project]
name = "pai2026-act"
version = "0.1.0"
description = "ACT (Action Chunking Transformer) のスクラッチ実装と ALOHA シミュレーションでの評価"
requires-python = ">=3.12,<3.13"
dependencies = [
    # 学習・推論
    "torch>=2.14",
    "torchvision>=0.29",
    # 学習ループ（ポリシーの中身は素の PyTorch。Lightning は学習の進行・ログ・保存だけに使う）
    "lightning>=2.6",
    # シミュレータ（借用部分）
    "gym-aloha>=0.1.4",
    # データセット読み出し（借用部分: ファイルI/Oのみ）
    "huggingface-hub>=0.30",
    "pyarrow>=18",
    "pandas>=2.2",
    "av>=14",
    # ログ・可視化
    "tensorboard>=2.18",
    "matplotlib>=3.9",
    "imageio[ffmpeg]>=2.34",
    "tqdm>=4.66",
    "wandb>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pai_act"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "matplotlib-fontja>=1.1.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "ty>=0.0.85",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# E/W: pycodestyle, F: pyflakes, I: import の並び順, B: bugbear, UP: 新しい構文への書き換え, SIM: 簡潔化
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# 長い行は ruff format が折り返す。折り返せない日本語のコメント・docstring は対象外にする
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# exps/config.py の arg() は dataclasses.field を返すだけなので、dataclass の既定値に使ってよい
extend-immutable-calls = ["pai_act.exps.config.arg"]
